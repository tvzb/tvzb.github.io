<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小区电费收据管理与打印系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 打印样式：打印时隐藏非收据元素，保证一张A4纸排4联或单张输出 */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .receipt-card {
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 8mm;
        box-shadow: none !important;
        border: 1.5px solid #333 !important;
      }
    }

    /* 模拟经典收据红印章 */
    .seal-box {
      border: 2px solid rgba(220, 38, 38, 0.7);
      color: rgba(220, 38, 38, 0.7);
      border-radius: 9999px;
      transform: rotate(-12deg);
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- 顶部导航栏 -->
  <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 text-white rounded-lg font-bold">⚡</div>
        <div>
          <h1 class="font-bold text-lg text-slate-800">小区电费收据管理与打印系统</h1>
          <p class="text-xs text-slate-500">自动计费 · 本地存储 · 单户/批量A4标准套打</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="switchTab('data')" id="tab-btn-data" class="px-3.5 py-1.5 rounded-md font-medium text-sm transition bg-indigo-600 text-white">
          📝 抄表与数据录入
        </button>
        <button onclick="switchTab('receipts')" id="tab-btn-receipts" class="px-3.5 py-1.5 rounded-md font-medium text-sm transition bg-slate-200 text-slate-700 hover:bg-slate-300">
          🧾 收据展示与打印
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6">
    <!-- ==================== TAB 1: 数据录入与后台管理 ==================== -->
    <section id="panel-data" class="space-x-0 space-y-6">
      
      <!-- 参数与计费标准配置栏 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5">
        <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
          <span>⚙️</span> 账期与单价设置
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
          <div>
            <label class="block text-xs text-slate-500 font-medium mb-1">开票年份</label>
            <input type="number" id="cfg-year" value="2026" class="w-full border rounded px-2.5 py-1.5 text-sm font-medium focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-medium mb-1">开票月份</label>
            <input type="number" id="cfg-month" value="10" min="1" max="12" class="w-full border rounded px-2.5 py-1.5 text-sm font-medium focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-medium mb-1">电费单价 (元/度)</label>
            <input type="number" step="0.01" id="cfg-rate-elec" value="0.70" class="w-full border rounded px-2.5 py-1.5 text-sm font-medium focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-medium mb-1">损耗单价 (元/度)</label>
            <input type="number" step="0.01" id="cfg-rate-loss" value="0.05" class="w-full border rounded px-2.5 py-1.5 text-sm font-medium focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-medium mb-1">垃圾清运费 (元/月)</label>
            <input type="number" step="0.5" id="cfg-fee-rubbish" value="4.00" class="w-full border rounded px-2.5 py-1.5 text-sm font-medium focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 font-medium mb-1">公共楼梯电费 (元/月)</label>
            <input type="number" step="0.5" id="cfg-fee-stair" value="3.00" class="w-full border rounded px-2.5 py-1.5 text-sm font-medium focus:ring-1 focus:ring-indigo-500">
          </div>
        </div>
      </div>

      <!-- 数据快捷操作条 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center space-x-2">
          <button onclick="addNewRow()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-sm font-medium flex items-center gap-1 shadow-sm transition">
            <span>+</span> 添加住户
          </button>
          <button onclick="loadSampleData()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm font-medium transition">
            填充示例数据
          </button>
          <button onclick="clearAllData()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md text-sm font-medium transition">
            清空所有
          </button>
        </div>
        <div class="flex items-center space-x-2 text-xs text-slate-500">
          <span>💾 数据自动保存在当前浏览器本地，无需数据库。</span>
          <button onclick="exportDataJSON()" class="underline text-indigo-600 hover:text-indigo-800">备份数据</button>
          <button onclick="importDataJSON()" class="underline text-indigo-600 hover:text-indigo-800">还原数据</button>
          <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="handleFileImport(event)">
        </div>
      </div>

      <!-- 数据表格 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-50 text-slate-600 border-b border-slate-200 text-xs font-semibold">
                <th class="p-3 w-12 text-center">#</th>
                <th class="p-3 w-28">房号</th>
                <th class="p-3 w-28">户主姓名</th>
                <th class="p-3 w-28">上月表数</th>
                <th class="p-3 w-28">本月表数</th>
                <th class="p-3 w-24 text-right">用电度数</th>
                <th class="p-3 w-24 text-right">基础电费</th>
                <th class="p-3 w-24 text-right">线损电费</th>
                <th class="p-3 w-24 text-right">固定杂费</th>
                <th class="p-3 w-28 text-right font-bold text-indigo-600">应收合计</th>
                <th class="p-3 w-24 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="resident-table-body" class="divide-y divide-slate-100 font-mono">
              <!-- 动态数据行由 JS 渲染 -->
            </tbody>
          </table>
        </div>
        <div id="table-empty-hint" class="hidden p-8 text-center text-slate-400 text-sm">
          暂无住户数据，点击上方“添加住户”或“填充示例数据”开始！
        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: 收据排版与打印展示 ==================== -->
    <section id="panel-receipts" class="hidden space-y-6">
      <!-- 打印操作栏 -->
      <div class="no-print bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
          <button onclick="window.print()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold flex items-center gap-2 shadow-sm transition">
            <span>🖨️️</span> 打印全部收据 (一键批量打印)
          </button>
          <span class="text-xs text-slate-500">建议在打印预览中选择：纸张 A4，边距“无”或“最小值”。</span>
        </div>
        <div class="text-sm font-medium text-slate-600">
          共计 <span id="receipt-count" class="text-indigo-600 font-bold">0</span> 户待收
        </div>
      </div>

      <!-- 打印区域 -->
      <div id="print-area" class="space-y-6">
        <!-- 收据卡片由 JS 动态生成 -->
      </div>
    </section>
  </main>

  <script>
    // 默认示例数据
    const DEFAULT_DATA = [
      { id: '1', room: '101', name: '张建国', lastMeter: 12503, curMeter: 12671 },
      { id: '2', room: '102', name: '李玉华', lastMeter: 8430, curMeter: 8590 },
      { id: '3', room: '201', name: '王晓明', lastMeter: 4320, curMeter: 4410 },
      { id: '4', room: '202', name: '陈志强', lastMeter: 15120, curMeter: 15305 }
    ];

    let residents = [];

    // 初始化载入
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('village_electricity_data');
      if (saved) {
        try {
          residents = JSON.parse(saved);
        } catch (e) {
          residents = [...DEFAULT_DATA];
        }
      } else {
        residents = [...DEFAULT_DATA];
      }
      renderTable();
    });

    // 保存到本地
    function saveData() {
      localStorage.setItem('village_electricity_data', JSON.stringify(residents));
    }

    // 金额计算与转换工具
    function calculateRecord(item) {
      const cur = parseFloat(item.curMeter) || 0;
      const last = parseFloat(item.lastMeter) || 0;
      const usage = Math.max(0, cur - last);

      const rateElec = parseFloat(document.getElementById('cfg-rate-elec').value) || 0.70;
      const rateLoss = parseFloat(document.getElementById('cfg-rate-loss').value) || 0.05;
      const feeRubbish = parseFloat(document.getElementById('cfg-fee-rubbish').value) || 4.00;
      const feeStair = parseFloat(document.getElementById('cfg-fee-stair').value) || 3.00;

      const feeElec = +(usage * rateElec).toFixed(2);
      const feeLoss = +(usage * rateLoss).toFixed(2);
      const fixedTotal = +(feeRubbish + feeStair).toFixed(2);
      const total = +(feeElec + feeLoss + fixedTotal).toFixed(2);

      return {
        usage,
        rateElec,
        rateLoss,
        feeRubbish,
        feeStair,
        feeElec,
        feeLoss,
        total,
        totalCn: numberToChineseAmount(total)
      };
    }

    // 人民币金额转大写
    function numberToChineseAmount(money) {
      const cnNums = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
      const cnIntRadice = ['', '拾', '佰', '仟'];
      const cnIntUnits = ['', '万', '亿', '兆'];
      const cnDecUnits = ['角', '分'];
      const cnInteger = '整';
      const cnIntLast = '元';
      
      let integerNum;
      let decimalNum;
      let chineseStr = '';

      if (money === 0) {
        return '零元整';
      }

      money = parseFloat(money);
      let parts = money.toString().split('.');
      integerNum = parts[0];
      decimalNum = parts.length > 1 ? parts[1].substr(0, 2) : '';

      if (parseInt(integerNum, 10) > 0) {
        let zeroCount = 0;
        let IntLen = integerNum.length;
        for (let i = 0; i < IntLen; i++) {
          let n = integerNum.substr(i, 1);
          let p = IntLen - i - 1;
          let q = p / 4;
          let m = p % 4;
          if (n == '0') {
            zeroCount++;
          } else {
            if (zeroCount > 0) {
              chineseStr += cnNums[0];
            }
            zeroCount = 0;
            chineseStr += cnNums[parseInt(n)] + cnIntRadice[m];
          }
          if (m == 0 && zeroCount < 4) {
            chineseStr += cnIntUnits[q];
          }
        }
        chineseStr += cnIntLast;
      }

      if (decimalNum !== '') {
        let decLen = decimalNum.length;
        for (let i = 0; i < decLen; i++) {
          let n = decimalNum.substr(i, 1);
          if (n !== '0') {
            chineseStr += cnNums[Number(n)] + cnDecUnits[i];
          }
        }
      }

      if (chineseStr === '') {
        chineseStr += cnNums[0] + cnIntLast;
      }
      if (decimalNum === '' || decimalNum === '00' || decimalNum === '0') {
        chineseStr += cnInteger;
      }
      return chineseStr;
    }

    // 渲染管理后台表格
    function renderTable() {
      const tbody = document.getElementById('resident-table-body');
      const emptyHint = document.getElementById('table-empty-hint');
      tbody.innerHTML = '';

      if (residents.length === 0) {
        emptyHint.classList.remove('hidden');
        return;
      }
      emptyHint.classList.add('hidden');

      residents.forEach((r, idx) => {
        const calc = calculateRecord(r);
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="p-3 text-center text-slate-400 font-sans">${idx + 1}</td>
          <td class="p-2">
            <input type="text" value="${r.room || ''}" onchange="updateItem('${r.id}', 'room', this.value)" class="w-full border rounded px-2 py-1 text-sm bg-white font-sans" placeholder="如 101">
          </td>
          <td class="p-2">
            <input type="text" value="${r.name || ''}" onchange="updateItem('${r.id}', 'name', this.value)" class="w-full border rounded px-2 py-1 text-sm bg-white font-sans" placeholder="业主姓名">
          </td>
          <td class="p-2">
            <input type="number" value="${r.lastMeter}" onchange="updateItem('${r.id}', 'lastMeter', this.value)" class="w-full border rounded px-2 py-1 text-sm bg-white" placeholder="上月底数">
          </td>
          <td class="p-2">
            <input type="number" value="${r.curMeter}" onchange="updateItem('${r.id}', 'curMeter', this.value)" class="w-full border rounded px-2 py-1 text-sm bg-white" placeholder="本月读数">
          </td>
          <td class="p-3 text-right font-medium text-slate-700">${calc.usage} 度</td>
          <td class="p-3 text-right text-slate-600">¥${calc.feeElec.toFixed(2)}</td>
          <td class="p-3 text-right text-slate-600">¥${calc.feeLoss.toFixed(2)}</td>
          <td class="p-3 text-right text-slate-600">¥${(calc.feeRubbish + calc.feeStair).toFixed(2)}</td>
          <td class="p-3 text-right font-bold text-indigo-600">¥${calc.total.toFixed(2)}</td>
          <td class="p-2 text-center font-sans">
            <button onclick="printSingle('${r.id}')" class="text-indigo-600 hover:text-indigo-800 text-xs mr-2 font-medium">打印</button>
            <button onclick="deleteItem('${r.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-medium">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 增删改操作
    function addNewRow() {
      const newId = Date.now().toString();
      residents.push({
        id: newId,
        room: '',
        name: '',
        lastMeter: 0,
        curMeter: 0
      });
      saveData();
      renderTable();
    }

    function updateItem(id, field, value) {
      const item = residents.find(r => r.id === id);
      if (item) {
        if (field === 'lastMeter' || field === 'curMeter') {
          item[field] = parseFloat(value) || 0;
        } else {
          item[field] = value.trim();
        }
        saveData();
        renderTable();
      }
    }

    function deleteItem(id) {
      if (confirm('确认删除该住户吗？')) {
        residents = residents.filter(r => r.id !== id);
        saveData();
        renderTable();
      }
    }

    function clearAllData() {
      if (confirm('确定要清空所有数据吗？此操作不可逆！')) {
        residents = [];
        saveData();
        renderTable();
      }
    }

    function loadSampleData() {
      residents = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData();
      renderTable();
    }

    // 渲染收据界面
    function renderReceipts(filterId = null) {
      const container = document.getElementById('print-area');
      container.innerHTML = '';

      const listToRender = filterId 
        ? residents.filter(r => r.id === filterId) 
        : residents;

      document.getElementById('receipt-count').innerText = listToRender.length;

      const year = document.getElementById('cfg-year').value;
      const month = document.getElementById('cfg-month').value;

      listToRender.forEach(r => {
        const calc = calculateRecord(r);
        const card = document.createElement('div');
        card.className = 'receipt-card bg-white border border-slate-300 rounded-lg p-6 max-w-3xl mx-auto text-slate-800 font-serif relative';
        
        card.innerHTML = `
          <!-- 顶部抬头与编号 -->
          <div class="flex justify-between items-start pb-2 border-b-2 border-slate-800 mb-3">
            <div>
              <h2 class="text-xl font-bold tracking-widest text-slate-900">收款收据</h2>
              <p class="text-xs text-slate-500 font-sans mt-0.5">（第二联：客户结算收执）</p>
            </div>
            <div class="text-right text-xs font-mono text-slate-500">
              <span class="text-slate-400">房号：</span><strong class="text-sm font-bold text-slate-800">${r.room || '未填'}</strong>
            </div>
          </div>

          <!-- 客户名称与开票日期 -->
          <div class="flex justify-between text-sm mb-3">
            <div>
              <span>客户名称：</span>
              <strong class="font-bold underline decoration-slate-400 underline-offset-4 px-2">${r.name || '未填'}</strong>
            </div>
            <div>
              <span>开票日期：</span>
              <span class="font-sans">${year} 年 ${month} 月 01 日</span>
            </div>
          </div>

          <!-- 收据核心明细表格（精准对应原有格式） -->
          <table class="w-full border-collapse border border-slate-700 text-xs sm:text-sm mb-3 text-center">
            <thead>
              <tr class="bg-slate-50">
                <th class="border border-slate-700 py-1.5 px-2 text-left">商品名称及规格</th>
                <th class="border border-slate-700 py-1.5 px-2 w-16">单位</th>
                <th class="border border-slate-700 py-1.5 px-2 w-20">数量</th>
                <th class="border border-slate-700 py-1.5 px-2 w-20">单价</th>
                <th class="border border-slate-700 py-1.5 px-2 w-28 text-right">金额 (元)</th>
                <th class="border border-slate-700 py-1.5 px-2 w-24">备注</th>
              </tr>
            </thead>
            <tbody>
              <!-- 电费 -->
              <tr>
                <td class="border border-slate-700 py-1 px-2 text-left font-sans">
                  电费 (${r.curMeter} - ${r.lastMeter})
                </td>
                <td class="border border-slate-700 py-1">度</td>
                <td class="border border-slate-700 py-1 font-mono">${calc.usage}</td>
                <td class="border border-slate-700 py-1 font-mono">${calc.rateElec.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 px-2 text-right font-mono font-semibold">${calc.feeElec.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 text-slate-400 text-xs">抄表数</td>
              </tr>

              <!-- 损耗 -->
              <tr>
                <td class="border border-slate-700 py-1 px-2 text-left font-sans">
                  损耗 (${r.curMeter} - ${r.lastMeter})
                </td>
                <td class="border border-slate-700 py-1">度</td>
                <td class="border border-slate-700 py-1 font-mono">${calc.usage}</td>
                <td class="border border-slate-700 py-1 font-mono">${calc.rateLoss.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 px-2 text-right font-mono font-semibold">${calc.feeLoss.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 text-slate-400 text-xs">变损线损</td>
              </tr>

              <!-- 垃圾清运费 -->
              <tr>
                <td class="border border-slate-700 py-1 px-2 text-left font-sans">垃圾清运费</td>
                <td class="border border-slate-700 py-1">月</td>
                <td class="border border-slate-700 py-1 font-mono">1</td>
                <td class="border border-slate-700 py-1 font-mono">${calc.feeRubbish.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 px-2 text-right font-mono font-semibold">${calc.feeRubbish.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 text-slate-400 text-xs">固定收费</td>
              </tr>

              <!-- 公共楼梯用电 -->
              <tr>
                <td class="border border-slate-700 py-1 px-2 text-left font-sans">公共楼梯用电</td>
                <td class="border border-slate-700 py-1">月</td>
                <td class="border border-slate-700 py-1 font-mono">1</td>
                <td class="border border-slate-700 py-1 font-mono">${calc.feeStair.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 px-2 text-right font-mono font-semibold">${calc.feeStair.toFixed(2)}</td>
                <td class="border border-slate-700 py-1 text-slate-400 text-xs">楼道分摊</td>
              </tr>

              <!-- 合计金额行 -->
              <tr class="font-bold bg-slate-50">
                <td class="border border-slate-700 py-1.5 px-2 text-left">合计 (人民币大写)</td>
                <td colspan="3" class="border border-slate-700 py-1.5 px-2 text-left text-slate-900 tracking-wider">
                  ${calc.totalCn}
                </td>
                <td colspan="2" class="border border-slate-700 py-1.5 px-2 text-right font-mono text-base text-rose-600 font-bold">
                  ¥ ${calc.total.toFixed(2)}
                </td>
              </tr>
            </tbody>
          </table>

          <!-- 底部签章区 -->
          <div class="flex justify-between items-center text-xs mt-3 text-slate-600">
            <div>收款单位（盖章）：_____________</div>
            <div>核算会计：___________</div>
            <div>收款人：___________</div>
          </div>

          <!-- 单户快捷打印悬浮按钮 (仅在屏幕上显示，不打印) -->
          <div class="no-print absolute top-3 right-3 flex items-center space-x-2">
            <button onclick="printSingleReceiptDirect('${r.id}')" class="px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 text-xs rounded border border-slate-200 transition">
              仅打印此张
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 切换标签页
    function switchTab(tab) {
      const pData = document.getElementById('panel-data');
      const pReceipts = document.getElementById('panel-receipts');
      const bData = document.getElementById('tab-btn-data');
      const bReceipts = document.getElementById('tab-btn-receipts');

      if (tab === 'data') {
        pData.classList.remove('hidden');
        pReceipts.classList.add('hidden');
        bData.className = 'px-3.5 py-1.5 rounded-md font-medium text-sm transition bg-indigo-600 text-white';
        bReceipts.className = 'px-3.5 py-1.5 rounded-md font-medium text-sm transition bg-slate-200 text-slate-700 hover:bg-slate-300';
      } else {
        pData.classList.add('hidden');
        pReceipts.classList.remove('hidden');
        bReceipts.className = 'px-3.5 py-1.5 rounded-md font-medium text-sm transition bg-indigo-600 text-white';
        bData.className = 'px-3.5 py-1.5 rounded-md font-medium text-sm transition bg-slate-200 text-slate-700 hover:bg-slate-300';
        renderReceipts();
      }
    }

    // 单户打印
    function printSingle(id) {
      switchTab('receipts');
      renderReceipts(id);
      setTimeout(() => {
        window.print();
        // 打印完成后恢复显示全部
        renderReceipts();
      }, 200);
    }

    function printSingleReceiptDirect(id) {
      renderReceipts(id);
      setTimeout(() => {
        window.print();
        renderReceipts();
      }, 200);
    }

    // 备份为本地 JSON 文件
    function exportDataJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(residents, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `小区电费底表_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 还原 JSON 文件
    function importDataJSON() {
      document.getElementById('json-file-input').click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) {
            residents = parsed;
            saveData();
            renderTable();
            alert('数据导入成功！');
          } else {
            alert('格式不正确，需为有效数据列表。');
          }
        } catch (err) {
          alert('读取文件失败，请确认是导出的 JSON 备份文件。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  </script>
</body>
</html>
