<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827"><title>弈 · 中国象棋</title>
<style>
:root{--bg:#101827;--panel:#1b2738;--panel2:#243247;--line:#35445a;--text:#edf2f7;--muted:#9eacc0;--gold:#d8b56d;--red:#d94b48;--green:#53b88b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#26364c 0,#101827 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
.app{max-width:1080px;margin:auto;padding:22px 18px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid #64748b;border-radius:13px;display:grid;place-items:center;color:var(--gold);font-size:23px;background:#202e41}.brand h1{font-size:20px;margin:0;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;margin-top:3px}.tag{font-size:12px;color:#b9c7d9;border:1px solid #42536a;padding:7px 11px;border-radius:20px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}.board-card,.side-card{background:linear-gradient(145deg,#1d2a3c,#172334);border:1px solid #35445a;border-radius:20px;box-shadow:0 18px 50px #0003}.board-card{padding:14px}.players{display:flex;justify-content:space-between;align-items:center;padding:2px 5px 12px}.player{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fdf3dc,#e8c68a 68%,#c39350);border:2px solid #6e4920;box-shadow:inset 0 0 0 2px #d8b274,0 2px 5px #0006;font-family:"KaiTi","STKaiti",serif;font-weight:bold;font-size:17px}
#redPlayer .avatar{color:#c0261d}
#blackPlayer .avatar{color:#181818}
.player.active{color:var(--text)}.player.active .avatar{outline:2px solid var(--gold);outline-offset:2px}.thinking{font-size:11px;color:var(--gold);min-height:15px;text-align:right}
.canvas-wrap{width:100%;max-width:660px;margin:auto;position:relative;touch-action:manipulation}canvas{display:block;width:100%;height:auto;border-radius:10px;cursor:pointer;touch-action:manipulation;box-shadow:0 10px 28px #0006}
.status{margin:12px 4px 2px;min-height:24px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:#c7d2e1}.status strong{color:var(--gold);font-weight:600}.side{display:flex;flex-direction:column;gap:14px}.side-card{padding:16px}.side-card h2{font-size:14px;margin:0 0 13px;letter-spacing:1px}.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.difficulty button,.actions button{border:1px solid #43536a;background:#253449;color:#dbe5f2;border-radius:10px;padding:10px 7px;font-size:12px;cursor:pointer;transition:.15s}.difficulty button.active{background:#544832;border-color:var(--gold);color:#ffe2a2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{padding:11px 8px;font-size:13px}.actions button.primary{background:#a77d3f;border-color:#c79b58;color:#fff}.actions button:disabled{opacity:.4;cursor:not-allowed}.tip{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 1px 0}.history{max-height:270px;overflow:auto;font-size:12px;color:#c5d0df}.history-row{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;padding:7px 5px;border-bottom:1px solid #ffffff0d}.history-row:nth-child(odd){background:#ffffff06}.history-row span:first-child{color:#8292a8}.empty{color:#8493a8;text-align:center;padding:18px 0}.footer{text-align:center;color:#66778e;font-size:11px;margin-top:18px}
.modal{position:fixed;inset:0;background:#050b14bb;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.dialog{background:#202e41;border:1px solid #52627a;border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 70px #0008}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted);font-size:13px}.dialog button{margin-top:12px;background:#b78a4b;color:white;border:0;border-radius:10px;padding:11px 25px;font-size:14px}
@media(max-width:760px){.app{padding:13px 10px 24px}.layout{grid-template-columns:1fr;gap:12px}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side-card{padding:13px}.history-card{grid-column:1/-1}.board-card{padding:9px}.top{margin-bottom:12px}.tag{font-size:10px}.brand h1{font-size:18px}}
@media(max-width:390px){.side{grid-template-columns:1fr}.history-card{grid-column:auto}.status{font-size:11px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">弈</div><div><h1>中国象棋</h1><small>XIANGQI · PLAY WITH AI</small></div></div><div class="tag">单机人机对弈</div></header>
<div class="layout">
<section class="board-card">
 <div class="players"><div id="redPlayer" class="player active"><span class="avatar">帅</span><span>红方 · 你</span></div><div><div id="think" class="thinking"></div><div id="blackPlayer" class="player"><span class="avatar">将</span><span>黑方 · 机器人</span></div></div></div>
 <div class="canvas-wrap"><canvas id="board" width="900" height="1000" aria-label="中国象棋棋盘"></canvas></div>
 <div class="status"><span id="message"><strong>轮到你走棋</strong> · 请点击红方棋子</span><span id="count">0 回合</span></div>
</section>
<aside class="side">
 <section class="side-card"><h2>机器人难度</h2><div class="difficulty"><button data-level="1" class="active">初级</button><button data-level="2">中级</button><button data-level="3">高级</button></div><p class="tip">难度越高，机器人思考的步数越多。高级模式可能需要稍等片刻。</p></section>
 <section class="side-card"><h2>对局操作</h2><div class="actions"><button id="undo">↶ 悔棋</button><button id="hint">✦ 提示走法</button><button id="restart" class="primary" style="grid-column:1/-1">＋ 重新开始</button></div><p class="tip">悔棋将撤销你和机器人的最近一轮走棋。</p></section>
 <section class="side-card history-card"><h2>棋谱记录</h2><div id="history" class="history"><div class="empty">棋局开始后，走棋记录会显示在这里</div></div></section>
</aside></div><div class="footer">本地 AI 引擎 · 无需注册 · 无需联网 · 祝你棋逢对手</div></main>
<div id="modal" class="modal"><div class="dialog"><h2 id="resultTitle">对局结束</h2><p id="resultText"></p><button id="modalRestart">再来一局</button></div></div>
<script>
(()=>{
const cv=document.getElementById('board'),ctx=cv.getContext('2d'),N=90;
const labels={r:{K:'帅',A:'仕',E:'相',H:'马',R:'车',C:'炮',P:'兵'},b:{K:'将',A:'士',E:'象',H:'马',R:'车',C:'炮',P:'卒'}};
const values={K:10000,A:120,E:120,H:300,R:600,C:320,P:70};
let board,turn,selected=null,legal=[],history=[],snapshots=[],level=1,gameOver=false,hintMove=null,thinking=false;
const initial=()=>[
['bR','bH','bE','bA','bK','bA','bE','bH','bR'],
[null,null,null,null,null,null,null,null,null],
[null,'bC',null,null,null,null,null,'bC',null],
['bP',null,'bP',null,'bP',null,'bP',null,'bP'],
[null,null,null,null,null,null,null,null,null],
[null,null,null,null,null,null,null,null,null],
['rP',null,'rP',null,'rP',null,'rP',null,'rP'],
[null,'rC',null,null,null,null,null,'rC',null],
[null,null,null,null,null,null,null,null,null],
['rR','rH','rE','rA','rK','rA','rE','rH','rR']];
const clone=b=>b.map(row=>row.map(p=>p?{s:p.s,t:p.t}:null));
const parse=s=>s?{s:s[0],t:s[1]}:null;
function reset(){board=initial().map(r=>r.map(parse));turn='r';selected=null;legal=[];history=[];snapshots=[];gameOver=false;hintMove=null;thinking=false;document.getElementById('modal').classList.remove('show');render();setMessage('轮到你走棋 · 请点击红方棋子');}
function inside(x,y){return x>=0&&x<9&&y>=0&&y<10}
function palace(x,y,s){return x>=3&&x<=5&&(s==='r'?y>=7&&y<=9:y>=0&&y<=2)}
function pseudo(b,x,y){const p=b[y][x];if(!p)return[];const out=[],s=p.s,enemy=s==='r'?'b':'r',add=(a,c)=>{if(inside(a,c)&&(!b[c][a]||b[c][a].s!==s))out.push([a,c])};
if(p.t==='K'||p.t==='A'){
 for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,c=y+dy;if(p.t==='K'?palace(a,c,s):palace(a,c,s))add(a,c)}
 if(p.t==='K'){for(let yy=y+(s==='r'?-1:1);inside(x,yy);yy+=(s==='r'?-1:1)){if(b[yy][x]){if(b[yy][x].s!==s&&b[yy][x].t==='K')out.push([x,yy]);break}}}
}else if(p.t==='E'){for(const [dx,dy] of [[2,2],[2,-2],[-2,2],[-2,-2]]){let a=x+dx,c=y+dy,mx=x+dx/2,my=y+dy/2;if(inside(a,c)&&!b[my][mx]&&(s==='r'?c>=5:c<=4)&&(!b[c][a]||b[c][a].s!==s))out.push([a,c])}}
else if(p.t==='H'){for(const [dx,dy] of [[1,2],[-1,2],[1,-2],[-1,-2],[2,1],[2,-1],[-2,1],[-2,-1]]){let a=x+dx,c=y+dy,bx=x+(Math.abs(dx)===2?dx/2:0),by=y+(Math.abs(dy)===2?dy/2:0);if(inside(a,c)&&!b[by][bx]&&(!b[c][a]||b[c][a].s!==s))out.push([a,c])}}
else if(p.t==='R'||p.t==='C'){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,c=y+dy,screen=false;while(inside(a,c)){let q=b[c][a];if(p.t==='R'){if(!q)out.push([a,c]);else{if(q.s!==s)out.push([a,c]);break}}else{if(!screen){if(!q)out.push([a,c]);else screen=true}else if(q){if(q.s!==s)out.push([a,c]);break}}a+=dx;c+=dy}}}
else if(p.t==='P'){let d=s==='r'?-1:1;add(x,y+d);if(s==='r'?y<=4:y>=5){add(x-1,y);add(x+1,y)}}
return out}
function kingPos(b,s){for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(b[y][x]?.s===s&&b[y][x].t==='K')return[x,y];return null}
function attacked(b,x,y,by){for(let yy=0;yy<10;yy++)for(let xx=0;xx<9;xx++){let p=b[yy][xx];if(p&&p.s===by&&pseudo(b,xx,yy).some(m=>m[0]===x&&m[1]===y))return true}return false}
function inCheck(b,s){let k=kingPos(b,s);if(!k)return true;return attacked(b,k[0],k[1],s==='r'?'b':'r')}
function apply(b,m){let n=clone(b),[x,y,a,c]=m;n[c][a]=n[y][x];n[y][x]=null;return n}
function movesFor(b,s){let all=[];for(let y=0;y<10;y++)for(let x=0;x<9;x++){let p=b[y][x];if(p&&p.s===s)for(let [a,c] of pseudo(b,x,y)){let n=apply(b,[x,y,a,c]);if(!inCheck(n,s))all.push([x,y,a,c])}}return all}
function legalFrom(x,y){return pseudo(board,x,y).filter(([a,c])=>!inCheck(apply(board,[x,y,a,c]),turn))}
function coord(x,y){return{x:45+x*101.25,y:50+y*100}}

// 绘制兵/炮位的传统十字花标
function drawStar(cx,cy,col){
 const d=8,l=18;
 ctx.strokeStyle='#4a2c11';ctx.lineWidth=1.8;
 const dirs=[];
 if(col>0)dirs.push([-1,-1],[-1,1]);
 if(col<8)dirs.push([1,-1],[1,1]);
 for(const [dx,dy] of dirs){
  ctx.beginPath();
  ctx.moveTo(cx+dx*d,cy+dy*(d+l));
  ctx.lineTo(cx+dx*d,cy+dy*d);
  ctx.lineTo(cx+dx*(d+l),cy+dy*d);
  ctx.stroke();
 }
}

function draw(){
 ctx.clearRect(0,0,900,1000);
 // 1. 实木棋盘外框底色（红木/胡桃木边框质感）
 const frameGrad=ctx.createLinearGradient(0,0,900,1000);
 frameGrad.addColorStop(0,'#b57c40');
 frameGrad.addColorStop(0.5,'#c68f52');
 frameGrad.addColorStop(1,'#9e6830');
 ctx.fillStyle=frameGrad;
 ctx.fillRect(0,0,900,1000);

 // 2. 棋盘内表面（传统榉木/椴木清漆暖黄色棋盘面）
 const boardGrad=ctx.createRadialGradient(450,500,60,450,500,680);
 boardGrad.addColorStop(0,'#e8c792');
 boardGrad.addColorStop(0.65,'#deb87c');
 boardGrad.addColorStop(1,'#d1a667');
 ctx.fillStyle=boardGrad;
 ctx.fillRect(20,25,860,950);

 // 细微横向木纹肌理线
 ctx.save();
 ctx.strokeStyle='rgba(110, 68, 25, 0.055)';
 ctx.lineWidth=1.5;
 for(let wy=30;wy<970;wy+=14){
  ctx.beginPath();
  ctx.moveTo(22,wy);
  ctx.bezierCurveTo(300,wy+(wy%28===0?3:-3),600,wy+(wy%28===0?-3:3),878,wy);
  ctx.stroke();
 }
 ctx.restore();

 // 3. 传统棋盘双层外框线（外粗内细）
 ctx.strokeStyle='#4a2c11';
 ctx.lineWidth=4;
 ctx.strokeRect(37,42,826,916);

 // 4. 棋盘网格线（楚河汉界上下分段绘制，避免clearRect破坏木纹）
 ctx.strokeStyle='#4a2c11';
 ctx.lineWidth=2.2;
 for(let x=0;x<9;x++){
  let xx=coord(x,0).x;
  if(x===0||x===8){
   ctx.beginPath();ctx.moveTo(xx,50);ctx.lineTo(xx,950);ctx.stroke();
  }else{
   ctx.beginPath();ctx.moveTo(xx,50);ctx.lineTo(xx,450);ctx.stroke();
   ctx.beginPath();ctx.moveTo(xx,550);ctx.lineTo(xx,950);ctx.stroke();
  }
 }
 for(let y=0;y<10;y++){
  let yy=coord(0,y).y;
  ctx.beginPath();ctx.moveTo(45,yy);ctx.lineTo(855,yy);ctx.stroke();
 }

 // 5. 九宫格斜线
 for(let y of [0,7]){
  ctx.beginPath();
  ctx.moveTo(coord(3,y).x,coord(3,y).y);ctx.lineTo(coord(5,y+2).x,coord(5,y+2).y);
  ctx.moveTo(coord(5,y).x,coord(5,y).y);ctx.lineTo(coord(3,y+2).x,coord(3,y+2).y);
  ctx.stroke();
 }

 // 6. 炮位与兵卒位十字花标
 for(const [sx,sy] of [[1,2],[7,2],[1,7],[7,7],[0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6]]){
  let q=coord(sx,sy);
  drawStar(q.x,q.y,sx);
 }

 // 7. 楚河汉界与坐标刻度文字
 ctx.fillStyle='#4a2c11';
 ctx.font='bold 38px "KaiTi","STKaiti",serif';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText('楚 河',248,500);
 ctx.fillText('汉 界',652,500);

 ctx.font='bold 15px "KaiTi","STKaiti",sans-serif';
 ctx.fillStyle='#3d230b';
 const topNums=['九','八','七','六','五','四','三','二','一'];
 const botNums=['一','二','三','四','五','六','七','八','九'];
 for(let i=0;i<9;i++){
  let xx=coord(i,0).x;
  ctx.fillText(topNums[i],xx,19);
  ctx.fillText(botNums[i],xx,983);
 }

 // 8. 选中态、合法落子点与提示框
 if(selected){
  let q=coord(selected[0],selected[1]);
  ctx.strokeStyle='#15803d';ctx.lineWidth=5;
  ctx.beginPath();ctx.arc(q.x,q.y,43,0,Math.PI*2);ctx.stroke();
 }
 for(let [x,y] of legal){
  let q=coord(x,y);
  ctx.fillStyle=board[y][x]?'#c62828':'#15803d';
  ctx.beginPath();
  if(board[y][x]){
   ctx.arc(q.x,q.y,44,0,Math.PI*2);
   ctx.strokeStyle='#c62828';ctx.lineWidth=4;ctx.stroke();
  }else{
   ctx.arc(q.x,q.y,10,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.stroke();
  }
 }
 if(hintMove){
  let [x,y,a,c]=hintMove;
  for(let [xx,yy] of [[x,y],[a,c]]){
   let q=coord(xx,yy);
   ctx.strokeStyle='#1d4ed8';ctx.lineWidth=6;
   ctx.beginPath();ctx.arc(q.x,q.y,47,0,Math.PI*2);ctx.stroke();
  }
 }

 // 9. 绘制棋子（红黑双方均采用现实黄杨木棋子材质，红方朱砂红字、黑方浓墨黑字）
 for(let y=0;y<10;y++)for(let x=0;x<9;x++){
  let p=board[y][x];if(!p)continue;
  let q=coord(x,y);
  const isRed=p.s==='r';

  ctx.save();
  // 棋子立体投影与木质底托厚度感
  ctx.shadowColor='rgba(40, 20, 5, 0.55)';
  ctx.shadowBlur=8;
  ctx.shadowOffsetX=2;
  ctx.shadowOffsetY=5;

  // 棋子外圈深木色侧壁
  ctx.fillStyle='#8c5828';
  ctx.beginPath();
  ctx.arc(q.x,q.y+2,40,0,Math.PI*2);
  ctx.fill();

  // 关闭阴影绘制正面黄杨木立体圆盘
  ctx.shadowColor='transparent';
  ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;

  const pieceGrad=ctx.createRadialGradient(q.x-12,q.y-12,5,q.x,q.y,40);
  pieceGrad.addColorStop(0,'#fff8e6');
  pieceGrad.addColorStop(0.55,'#f1d49f');
  pieceGrad.addColorStop(0.88,'#dba965');
  pieceGrad.addColorStop(1,'#b57e3d');
  ctx.fillStyle=pieceGrad;
  ctx.beginPath();
  ctx.arc(q.x,q.y,39,0,Math.PI*2);
  ctx.fill();

  // 棋子外边缘木质包边线
  ctx.strokeStyle='#6e4219';
  ctx.lineWidth=2;
  ctx.stroke();

  // 棋子内圈阴刻双环（红方朱砂红，电脑黑方浓墨黑）
  const inkColor=isRed?'#bf241a':'#161616';
  ctx.strokeStyle='rgba(255,250,235,0.65)';
  ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.arc(q.x,q.y+1,32,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeStyle=inkColor;
  ctx.lineWidth=2.2;
  ctx.beginPath();
  ctx.arc(q.x,q.y,32,0,Math.PI*2);
  ctx.stroke();

  // 棋子文字阴刻高光与填漆效果
  ctx.font='bold 40px "KaiTi","STKaiti","华文楷体",serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,252,242,0.75)';
  ctx.fillText(labels[p.s][p.t],q.x+1,q.y+2);

  ctx.fillStyle=inkColor;
  ctx.fillText(labels[p.s][p.t],q.x,q.y+1);
  ctx.restore();
 }
}
function render(){draw();document.getElementById('count').textContent=Math.floor(history.length/2)+' 回合';document.getElementById('undo').disabled=history.length===0||thinking;document.getElementById('hint').disabled=turn!=='r'||gameOver||thinking;document.getElementById('redPlayer').classList.toggle('active',turn==='r');document.getElementById('blackPlayer').classList.toggle('active',turn==='b');document.getElementById('history').innerHTML=history.length?history.reduce((acc,m,i)=>{if(i%2===0)acc.push(`<div class="history-row"><span>${Math.floor(i/2)+1}</span><span>${m}</span><span>${history[i+1]||''}</span></div>`);return acc},[]).join(''):'<div class="empty">棋局开始后，走棋记录会显示在这里</div>'}
function setMessage(s){document.getElementById('message').innerHTML=s}
function notation(m,p,captured){let [x,y,a,c]=m;let name=labels[p.s][p.t];let side=p.s==='r'?'红':'黑';let action=captured?'吃':'走';return side+name+' '+(x+1)+','+(10-y)+' '+action+' '+(a+1)+','+(10-c)}
function finish(winner,reason){gameOver=true;thinking=false;document.getElementById('think').textContent='';document.getElementById('resultTitle').textContent=winner==='r'?'恭喜你，获胜！':winner==='b'?'机器人获胜':'和棋';document.getElementById('resultText').textContent=reason;document.getElementById('modal').classList.add('show');render()}
function commit(m){let [x,y,a,c]=m,p=board[y][x],captured=board[c][a];snapshots.push({board:clone(board),turn,history:history.slice()});history.push(notation(m,p,captured));board=apply(board,m);turn=turn==='r'?'b':'r';selected=null;legal=[];hintMove=null;render();if(!kingPos(board,turn)){finish(turn==='r'?'b':'r','对方将帅已被吃掉。');return}let ms=movesFor(board,turn);if(!ms.length){if(inCheck(board,turn))finish(turn==='r'?'b':'r','将死！');else finish(null,'无棋可走，判为和棋。');return}if(inCheck(board,turn))setMessage('<strong>将军！</strong> '+(turn==='r'?'请应将':'机器人正在应将'));else setMessage(turn==='r'?'<strong>轮到你走棋</strong>':'<strong>机器人回合</strong>');if(turn==='b')setTimeout(aiTurn,80)}
function clickBoard(e){if(gameOver||thinking||turn!=='r')return;let rect=cv.getBoundingClientRect(),sx=cv.width/rect.width,sy=cv.height/rect.height,x=Math.round((e.clientX-rect.left)*sx-45)/101.25,y=Math.round((e.clientY-rect.top)*sy-50)/100;x=Math.round(x);y=Math.round(y);if(!inside(x,y))return;
if(selected){let m=legal.find(([a,c])=>a===x&&c===y);if(m){commit([selected[0],selected[1],x,y]);return}}
let p=board[y][x];if(p&&p.s==='r'){selected=[x,y];legal=legalFrom(x,y);hintMove=null}else{selected=null;legal=[]}render()}
cv.addEventListener('click',clickBoard);
function evaluate(b){let score=0;for(let y=0;y<10;y++)for(let x=0;x<9;x++){let p=b[y][x];if(!p)continue;let v=values[p.t];if(p.t==='P')v+= (p.s==='r'?9-y:y)*8;if(p.t==='H'||p.t==='C')v+=(4-Math.abs(4-x))*4;score+=(p.s==='b'?v:-v)}return score}
function search(b,depth,alpha,beta,side){let ms=movesFor(b,side);if(!ms.length)return inCheck(b,side)?(side==='b'?-99999-depth:99999+depth):0;if(depth===0)return evaluate(b);ms.sort((m1,m2)=>{let s1=b[m1[3]][m1[2]]?values[b[m1[3]][m1[2]].t]:0,s2=b[m2[3]][m2[2]]?values[b[m2[3]][m2[2]].t]:0;return s2-s1});if(side==='b'){let best=-Infinity;for(let m of ms){let v=search(apply(b,m),depth-1,alpha,beta,'r');best=Math.max(best,v);alpha=Math.max(alpha,v);if(beta<=alpha)break}return best}else{let best=Infinity;for(let m of ms){let v=search(apply(b,m),depth-1,alpha,beta,'b');best=Math.min(best,v);beta=Math.min(beta,v);if(beta<=alpha)break}return best}}
function chooseAI(){let ms=movesFor(board,'b');if(!ms.length)return null;let depth=level===1?1:level===2?2:3;let best=-Infinity,choices=[];for(let m of ms){let v=search(apply(board,m),depth-1,-Infinity,Infinity,'r');if(v>best){best=v;choices=[m]}else if(v===best)choices.push(m)}return choices[Math.floor(Math.random()*choices.length)]}
function aiTurn(){if(gameOver||turn!=='b')return;thinking=true;document.getElementById('think').textContent='机器人思考中…';render();setTimeout(()=>{if(gameOver||turn!=='b')return;let m=chooseAI();thinking=false;document.getElementById('think').textContent='';if(m)commit(m);else finish('r','机器人无棋可走。')},30)}
document.getElementById('undo').onclick=()=>{if(!snapshots.length||thinking)return;let target=snapshots.length>=2?snapshots.length-2:0;let s=snapshots[target];board=clone(s.board);turn=s.turn;history=s.history.slice();snapshots=snapshots.slice(0,target);selected=null;legal=[];hintMove=null;gameOver=false;document.getElementById('modal').classList.remove('show');render();setMessage('已悔棋 · 轮到你走棋')};
document.getElementById('restart').onclick=reset;document.getElementById('modalRestart').onclick=reset;
document.getElementById('hint').onclick=()=>{if(turn!=='r'||gameOver||thinking)return;let ms=movesFor(board,'r');if(!ms.length)return;let best=-Infinity,choice=ms[0];for(let m of ms){let v=evaluate(apply(board,m));if(v>best){best=v;choice=m}}hintMove=choice;render();setMessage('蓝色圆圈表示提示的起点和建议落点')};
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b))});
reset();
})();
</script></body></html>
