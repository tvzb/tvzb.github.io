const frame=document.getElementById('toolFrame');
function decodePage(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function openPage(name){frame.srcdoc=decodePage(pages[name]);document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===name));try{sessionStorage.setItem('cl_tool_active',name)}catch(e){}}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));
let initial='ai.html';try{const saved=sessionStorage.getItem('cl_tool_active');if(saved&&pages[saved])initial=saved}catch(e){}
openPage(initial);
</script></body></html>
