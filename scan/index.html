<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>流水线三段码与尾号精准预警器</title>
  <!-- 引入 Tesseract.js 本地 WebAssembly OCR 引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 52vh;
      background: #000;
    }
    video, #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #dashboard {
      height: 48vh;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1c1c1e;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2c2c2e;
      color: #fff;
      outline: none;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }
    button.stop { background: #ff3b30; }
    .stats-card {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #2c2c2e;
      padding: 6px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-item .num {
      font-size: 24px;
      font-weight: 800;
      color: #30d158;
    }
    .stat-item .num.hit { color: #ff453a; }
    .stat-item .label {
      font-size: 11px;
      color: #aaa;
    }
    #logBox {
      flex: 1;
      overflow-y: auto;
      background: #0a0a0a;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      border: 1px solid #333;
    }
    .log-item { margin-bottom: 4px; line-height: 1.3; }
    .log-item.hit { 
      color: #ff3b30; 
      font-weight: bold; 
      background: rgba(255, 59, 48, 0.15); 
      padding: 2px 4px; 
      border-radius: 4px; 
    }
    #statusBadge {
      font-size: 12px;
      color: #ffd60a;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- 顶部镜头画幅区 -->
  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- 底部操控与数据显示区 -->
  <div id="dashboard">
    <div id="statusBadge">初始化中，请稍候...</div>
    
    <div class="input-row">
      <input type="text" id="targetTail" value="785" placeholder="监控尾号/网点 (如: 785 或 T07-01-785)" />
      <button id="btnToggle">启动监控</button>
    </div>

    <div class="stats-card">
      <div class="stat-item">
        <div class="num" id="totalCount">0</div>
        <div class="label">本班次扫码总数</div>
      </div>
      <div class="stat-item">
        <div class="num hit" id="hitCount">0</div>
        <div class="label">目标件命中数</div>
      </div>
      <div class="stat-item">
        <button id="btnReset" style="background:#555; padding: 6px 12px; font-size: 13px;">换班清零</button>
      </div>
    </div>

    <div id="logBox">
      <div class="log-item" style="color: #666;">系统日志就绪...</div>
    </div>
  </div>

  <!-- 离屏切片 Canvas (不显示，仅供局部数字 OCR 处理) -->
  <canvas id="cropCanvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');

    const btnToggle = document.getElementById('btnToggle');
    const btnReset = document.getElementById('btnReset');
    const targetInput = document.getElementById('targetTail');
    const totalCountEl = document.getElementById('totalCount');
    const hitCountEl = document.getElementById('hitCount');
    const logBox = document.getElementById('logBox');
    const statusBadge = document.getElementById('statusBadge');

    let stream = null;
    let isRunning = false;
    let isOcrBusy = false;
    let ocrWorker = null;

    // 核心防重与统计集合 (以面单条形码为终身指纹，手遮挡再露出来绝不重计)
    const processedBarcodes = new Set();
    let totalDetected = 0;
    let hitDetected = 0;

    // 增强型流水线蜂鸣报警系统 (穿透力强的高低双音)
    let audioCtx = null;
    function playHitAlarm() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        // 第一声高音 (1200Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1200, now);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.12);

        // 第二声更高音 (1800Hz)，形成清脆的双击声 "哔-哔"
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1800, now + 0.14);
        gain2.gain.setValueAtTime(0.5, now + 0.14);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.14);
        osc2.stop(now + 0.32);

        // 手机马达振动提示 (200ms)
        if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
      } catch (e) {
        console.error('音频播放失败', e);
      }
    }

    // 初始化轻量 OCR 引擎
    async function initOcr() {
      statusBadge.textContent = '正在载入本地轻量 OCR 核心...';
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_char_whitelist: '0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ', // 仅允许大写英文字母、数字和连字符
      });
      statusBadge.textContent = '核心就绪，点击“启动监控”即可使用';
    }

    // 启动摄像头
    async function startCamera() {
      try {
        if (!ocrWorker) await initOcr();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        video.srcObject = stream;
        await video.play();

        isRunning = true;
        btnToggle.textContent = '停止';
        btnToggle.classList.add('stop');
        statusBadge.textContent = '● 正在监控流水线...';
        loopDetection();
      } catch (err) {
        alert('相机启动失败：' + err.message + '\n请务必使用 HTTPS 协议访问！');
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      btnToggle.textContent = '启动监控';
      btnToggle.classList.remove('stop');
      statusBadge.textContent = '已停止';
    }

    // 原生条码检测器 (利用系统 NPU/GPU 毫秒级硬解码)
    const barcodeDetector = 'BarcodeDetector' in window 
      ? new BarcodeDetector({ formats: ['code_128'] }) 
      : null;

    async function loopDetection() {
      if (!isRunning) return;

      if (video.videoWidth && overlay.width !== video.videoWidth) {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
      }

      ctx.clearRect(0, 0, overlay.width, overlay.height);

      if (barcodeDetector) {
        try {
          const codes = await barcodeDetector.detect(video);

          for (const code of codes) {
            const barcodeVal = (code.rawValue || '').trim();
            const box = code.boundingBox;
            if (!box || !barcodeVal) continue;

            // 无论是否处理过，都在画面上给条码标记出定位线
            const isAlreadyHandled = processedBarcodes.has(barcodeVal);
            ctx.strokeStyle = isAlreadyHandled ? 'rgba(48, 209, 88, 0.4)' : '#30d158';
            ctx.lineWidth = 4;
            ctx.strokeRect(box.x, box.y, box.width, box.height);

            // 如果该单号已经在此班次记录过（比如人手遮挡后再次露出），直接快速跳过，绝不浪费算力
            if (isAlreadyHandled) {
              continue;
            }

            // 锁定条形码正下方的“三段码加粗大字区” (ROI)
            const roiX = Math.max(0, box.x - 10);
            const roiY = box.y + box.height + 2; 
            const roiW = box.width + 20;
            const roiH = box.height * 0.75;

            // 绘制黄色瞄准框
            ctx.strokeStyle = '#ffd60a';
            ctx.lineWidth = 3;
            ctx.strokeRect(roiX, roiY, roiW, roiH);

            // 局部交给 OCR 识别（如果当前有任务在跑，则下一帧再切）
            if (!isOcrBusy) {
              recognizeRoiText(barcodeVal, roiX, roiY, roiW, roiH);
              break; 
            }
          }
        } catch (e) {
          // 偶尔运动模糊帧忽略
        }
      }

      requestAnimationFrame(loopDetection);
    }

    // 局部极速识别与图像二值化
    async function recognizeRoiText(barcodeVal, rx, ry, rw, rh) {
      isOcrBusy = true;
      try {
        cropCanvas.width = rw;
        cropCanvas.height = rh;

        // 仅截取条码下方这块矩形
        cropCtx.drawImage(video, rx, ry, rw, rh, 0, 0, rw, rh);

        // 送进轻量 OCR 引擎
        const { data: { text } } = await ocrWorker.recognize(cropCanvas);
        const cleanText = text.replace(/[\r\n\s]/g, '');

        if (cleanText.length >= 3) {
          handleMatching(barcodeVal, cleanText);
        }
      } catch (err) {
        console.error(err);
      } finally {
        isOcrBusy = false;
      }
    }

    // 匹配与去重处理逻辑
    function handleMatching(barcodeVal, ocrResult) {
      // 二次安全校验：确保绝对不重复统计
      if (processedBarcodes.has(barcodeVal)) return;
      processedBarcodes.add(barcodeVal);

      // 流水总计数 +1
      totalDetected++;
      totalCountEl.textContent = totalDetected;

      // 目标段号匹配规则 (支持多段输入，逗号隔开)
      const targets = targetInput.value
        .split(/[,，\s]+/)
        .map(t => t.trim())
        .filter(Boolean);

      // 只要三段码包含设定的字段（比如 "785" 或 "T07-01-785"）均可触发命中
      const isHit = targets.some(target => ocrResult.includes(target));

      if (isHit) {
        hitDetected++;
        hitCountEl.textContent = hitDetected;

        // 响警报 + 震动
        playHitAlarm();

        appendLog(`【命中】单号:${barcodeVal.slice(-5)} | 三段码:${ocrResult}`, true);
      } else {
        appendLog(`正常: 单号:${barcodeVal.slice(-5)} | 三段码:${ocrResult}`);
      }
    }

    function appendLog(msg, isHit = false) {
      const el = document.createElement('div');
      el.className = 'log-item' + (isHit ? ' hit' : '');
      const time = new Date().toTimeString().slice(0, 8);
      el.textContent = `${time} ${msg}`;
      logBox.insertBefore(el, logBox.firstChild);
      if (logBox.children.length > 30) logBox.removeChild(logBox.lastChild);
    }

    // 控制按钮
    btnToggle.addEventListener('click', () => {
      // 激活音频上下文
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (isRunning) stopCamera();
      else startCamera();
    });

    btnReset.addEventListener('click', () => {
      totalDetected = 0;
      hitDetected = 0;
      totalCountEl.textContent = '0';
      hitCountEl.textContent = '0';
      processedBarcodes.clear(); // 清空本班次记忆指纹
      logBox.innerHTML = '';
      appendLog('班次已换班重置，已清空全部单号记录');
    });

    // 页面加载完成后预载入 OCR
    initOcr();
  </script>
</body>
</html>
