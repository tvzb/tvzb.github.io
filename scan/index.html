<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>流水线三段码尾号追踪器</title>
  <!-- 引入 Tesseract.js 纯本地 WebAssembly OCR 引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 55vh;
      background: #000;
    }
    video, #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #dashboard {
      height: 45vh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1c1c1e;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2c2c2e;
      color: #fff;
      outline: none;
    }
    button {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }
    button.stop { background: #ff3b30; }
    .stats-card {
      display: flex;
      justify-content: space-around;
      background: #2c2c2e;
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-item .num {
      font-size: 22px;
      font-weight: bold;
      color: #30d158;
    }
    .stat-item .num.hit { color: #ff453a; }
    .stat-item .label {
      font-size: 12px;
      color: #aaa;
    }
    #logBox {
      flex: 1;
      overflow-y: auto;
      background: #000;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
    .log-item { margin-bottom: 4px; }
    .log-item.hit { color: #ff453a; font-weight: bold; }
    #statusBadge {
      font-size: 12px;
      color: #ff9f0a;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="dashboard">
    <div id="statusBadge">引擎就绪，请输入目标尾号并启动</div>
    
    <div class="input-row">
      <input type="text" id="targetTail" value="785" placeholder="监控三段码尾号(如: 785 或 785,112)" />
      <button id="btnToggle">启动相机</button>
    </div>

    <div class="stats-card">
      <div class="stat-item">
        <div class="num" id="totalCount">0</div>
        <div class="label">扫码总件数</div>
      </div>
      <div class="stat-item">
        <div class="num hit" id="hitCount">0</div>
        <div class="label">命中目标件</div>
      </div>
      <div class="stat-item">
        <button id="btnReset" style="background:#555; padding: 4px 10px; font-size: 13px;">清零</button>
      </div>
    </div>

    <div id="logBox">
      <div class="log-item" style="color: #666;">日志区：识别到的三段码将显示在此处...</div>
    </div>
  </div>

  <!-- 离屏 Canvas，用于截取条码下方小区域图片进行 OCR -->
  <canvas id="cropCanvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');

    const btnToggle = document.getElementById('btnToggle');
    const btnReset = document.getElementById('btnReset');
    const targetInput = document.getElementById('targetTail');
    const totalCountEl = document.getElementById('totalCount');
    const hitCountEl = document.getElementById('hitCount');
    const logBox = document.getElementById('logBox');
    const statusBadge = document.getElementById('statusBadge');

    let stream = null;
    let isRunning = false;
    let isOcrBusy = false; // OCR 互斥锁，避免上一帧没算完就堆积
    let ocrWorker = null;

    let totalDetected = 0;
    let hitDetected = 0;
    const historyMap = new Map(); // 单号去重缓存
    const DEDUP_INTERVAL_MS = 4000; // 4秒内不重复报同一个单

    // 1. 初始化 Web Audio 蜂鸣声
    let audioCtx = null;
    function playBeep(freq = 920, duration = 0.18) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // 2. 初始化 Tesseract 纯数字+字母模式（极大提升识别速度）
    async function initOcr() {
      statusBadge.textContent = '正在加载 OCR 核心组件...';
      ocrWorker = await Tesseract.createWorker('eng'); // 只载入英文/数字库，体积小速度快
      await ocrWorker.setParameters({
        tessedit_char_whitelist: '0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ', // 仅允许大写、数字与连字符
      });
      statusBadge.textContent = 'OCR 引擎就绪';
    }

    // 3. 启动相机
    async function startCamera() {
      try {
        if (!ocrWorker) await initOcr();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        video.srcObject = stream;
        await video.play();

        isRunning = true;
        btnToggle.textContent = '停止';
        btnToggle.classList.add('stop');
        statusBadge.textContent = '监控中：对准传送带面单';
        loopDetection();
      } catch (err) {
        alert('启动失败：' + err.message + '\n请确认已使用 HTTPS 协议访问！');
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      btnToggle.textContent = '启动相机';
      btnToggle.classList.remove('stop');
      statusBadge.textContent = '已停止';
    }

    // 4. 主循环：条形码精准定位
    const barcodeDetector = 'BarcodeDetector' in window 
      ? new BarcodeDetector({ formats: ['code_128'] }) 
      : null;

    async function loopDetection() {
      if (!isRunning) return;

      if (video.videoWidth && overlay.width !== video.videoWidth) {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
      }

      ctx.clearRect(0, 0, overlay.width, overlay.height);

      if (barcodeDetector && !isOcrBusy) {
        try {
          const codes = await barcodeDetector.detect(video);
          for (const code of codes) {
            const rawVal = code.rawValue || '';
            const box = code.boundingBox;
            if (!box) continue;

            // 绘制条形码绿框
            ctx.strokeStyle = '#30d158';
            ctx.lineWidth = 4;
            ctx.strokeRect(box.x, box.y, box.width, box.height);

            // 核心推导：根据面单排版，三段码永远在条码正下方
            // 高度约为条码高的一半，宽度基本与条形码同宽略宽
            const roiX = Math.max(0, box.x - 10);
            const roiY = box.y + box.height + 4; // 条码底部往下 4 像素开始
            const roiW = box.width + 20;
            const roiH = box.height * 0.75;      // 截取大字区域的高度

            // 在屏幕上画出瞄准框（黄色框代表正在分析这排三段码）
            ctx.strokeStyle = '#ffd60a';
            ctx.lineWidth = 3;
            ctx.strokeRect(roiX, roiY, roiW, roiH);

            // 检查该快递单号是否在去重缓存内
            const now = Date.now();
            const lastSeen = historyMap.get(rawVal) || 0;

            if (now - lastSeen > DEDUP_INTERVAL_MS) {
              // 触发局部 OCR
              recognizeRoiText(rawVal, roiX, roiY, roiW, roiH);
              break; // 每帧优先处理一个，避免争抢资源
            }
          }
        } catch (e) {
          // 异常帧跳过
        }
      }

      requestAnimationFrame(loopDetection);
    }

    // 5. 局部定向 OCR 截取与比对
    async function recognizeRoiText(barcodeVal, rx, ry, rw, rh) {
      isOcrBusy = true;
      statusBadge.textContent = `抓取到条码[${barcodeVal.slice(-4)}]，正在识别三段码...`;

      try {
        // 设置离屏裁剪尺寸
        cropCanvas.width = rw;
        cropCanvas.height = rh;

        // 局部图像二值化增强（黑白对比度提升，防反光）
        cropCtx.drawImage(video, rx, ry, rw, rh, 0, 0, rw, rh);

        // 调用 Tesseract 仅识别这一个小切片
        const { data: { text } } = await ocrWorker.recognize(cropCanvas);
        const cleanText = text.replace(/[\r\n\s]/g, '');

        if (cleanText.length >= 3) {
          handleMatching(barcodeVal, cleanText);
        }
      } catch (err) {
        console.error(err);
      } finally {
        isOcrBusy = false;
        if (isRunning) statusBadge.textContent = '监控中：对准传送带面单';
      }
    }

    // 6. 尾号比对与报警逻辑
    function handleMatching(barcodeVal, ocrResult) {
      const now = Date.now();
      historyMap.set(barcodeVal, now); // 标记此包裹已处理，防止短时间内狂报

      totalDetected++;
      totalCountEl.textContent = totalDetected;

      // 提取三段码最后3位数字（匹配末尾可能带有的字母或数字）
      // 如 552-T07-01-785 提取出 785
      const numMatches = ocrResult.match(/\d{3}$/) || [ocrResult.slice(-3)];
      const tailStr = numMatches[0];

      const targets = targetInput.value
        .split(/[,，\s]+/)
        .map(t => t.trim())
        .filter(Boolean);

      const isHit = targets.some(target => ocrResult.includes(target));

      if (isHit) {
        hitDetected++;
        hitCountEl.textContent = hitDetected;

        // 连续双声急促警报！
        playBeep(1100, 0.12);
        setTimeout(() => playBeep(1400, 0.2), 150);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

        appendLog(`【命中】单号尾${barcodeVal.slice(-4)} | 三段码:${ocrResult} (尾号:${tailStr})`, true);
      } else {
        appendLog(`扫描: 单号尾${barcodeVal.slice(-4)} | 三段码:${ocrResult}`);
      }
    }

    function appendLog(msg, isHit = false) {
      const el = document.createElement('div');
      el.className = 'log-item' + (isHit ? ' hit' : '');
      const time = new Date().toTimeString().slice(0, 8);
      el.textContent = `${time} ${msg}`;
      logBox.insertBefore(el, logBox.firstChild);
      if (logBox.children.length > 25) logBox.removeChild(logBox.lastChild);
    }

    // 按钮事件
    btnToggle.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (isRunning) stopCamera();
      else startCamera();
    });

    btnReset.addEventListener('click', () => {
      totalDetected = 0;
      hitDetected = 0;
      totalCountEl.textContent = '0';
      hitCountEl.textContent = '0';
      historyMap.clear();
      logBox.innerHTML = '';
      appendLog('计数已重置');
    });
  </script>
</body>
</html>
